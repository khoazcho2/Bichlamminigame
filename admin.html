<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Thêm Link</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 0 auto; padding: 20px; }
    input, button { width: 100%; padding: 12px; margin: 10px 0; font-size: 16px; }
    button { background: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px; }
    button:hover { background: #218838; }
    #list { margin-top: 30px; }
    .delete-btn { background: #dc3545; width: auto; margin-left: 10px; }
    .item { padding: 10px; background: #f8f9fa; margin: 10px 0; border-radius: 5px; }
    h1 { text-align: center; }
  </style>
</head>
<body>
  <h1>🔧 Admin</h1>
  
  <input type="password" id="password" placeholder="Nhập mật khẩu admin">
  <button onclick="checkPassword()">Đăng nhập</button>

  <div id="adminPanel" style="display:none;">
    <h3>Thêm link mới:</h3>
    <input type="text" id="title" placeholder="Tiêu đề">
    <input type="url" id="url" placeholder="URL">
    <select id="category">
      <option value="Game">Game</option>
      <option value="Tool">Tool</option>
      <option value="Phần mềm">Phần mềm</option>
      <option value="Tài liệu">Tài liệu</option>
    </select>
    <button onclick="addLink()">Thêm link</button>
    
    <h3>Danh sách link:</h3>
    <div id="list"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://huhyetvefyhlhyldkvis.supabase.co";
    const supabaseKey = "sb_publishable_40AA8unUr1HLIcgBn4gkFg_dvmCshjR"; 
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    function checkPassword() {
      const pw = document.getElementById('password').value;
      if (pw === 'hoquocdz01') {
        document.getElementById('adminPanel').style.display = 'block';
        document.getElementById('password').style.display = 'none';
        loadLinks();
      } else {
        alert('Sai mật khẩu!');
      }
    }

    async function addLink() {
      const title = document.getElementById("title").value;
      const url = document.getElementById("url").value;
      const category = document.getElementById("category").value;

      if (!title || !url) {
        alert('Điền đầy đủ!');
        return;
      }

      const { data, error } = await supabase
        .from("link")
        .insert([{ title, url, category, created_at: new Date().toISOString() }]);

      if (error) {
        alert("❌ " + error.message);
      } else {
        alert("✅ Thêm thành công!");
        document.getElementById("title").value = '';
        document.getElementById("url").value = '';
        loadLinks();
      }
    }

    async function loadLinks() {
      const { data, error } = await supabase
        .from("link")
        .select("*")
        .order('created_at', { ascending: false });

      const list = document.getElementById("list");
      
      if (error) {
        list.innerHTML = "❌ Lỗi: " + error.message;
        return;
      }

      list.innerHTML = '';
      if (!data || data.length === 0) {
        list.innerHTML = "<p>Chưa có link.</p>";
        return;
      }

      data.forEach((link, index) => {
        list.innerHTML += `
          <div class="item">
            <strong>${link.title}</strong> - ${link.category} 
            <a href="${link.url}" target="_blank">🔗</a>
            <button class="delete-btn" onclick="deleteLink('${link.id}')">Xóa</button>
          </div>
        `;
      });
    }

    async function deleteLink(id) {
      if (!confirm('Xóa?')) return;
      
      const { error } = await supabase
        .from("link")
        .delete()
        .eq('id', id);

      if (error) {
        alert("❌ " + error.message);
      } else {
        loadLinks();
      }
    }
  </script>
</body>
</html>
