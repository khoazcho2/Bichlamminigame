<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Quản lý Link Tải</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>🔧 Admin Quản lý</h1>
    </header>

    <div class="controls">
      <input type="text" id="searchInputAdmin" placeholder="Tìm kiếm..." oninput="performAdminSearch()">
      <select id="categoryFilterAdmin" onchange="performAdminSearch()">
        <!-- JS -->
      </select>
      <button id="loginBtnAdmin" onclick="showLogin()">Đăng nhập</button>
      <button id="logoutBtnAdmin" onclick="logoutAdmin()" style="display:none;">Đăng xuất</button>
    </div>

    <!-- Login Form -->
    <form id="loginFormAdmin" style="display:none;" onsubmit="return false;">
      <input type="password" id="passwordAdmin" placeholder="Nhập mật khẩu admin">
      <button type="button" onclick="loginAdmin()">Đăng nhập</button>
    </form>

    <!-- Admin Forms -->
    <div id="adminContent" style="display:none;">
      <button onclick="showAddFormAdmin()">➕ Thêm mới</button>
      <form id="resourceFormAdmin" style="display:none; margin-top:1rem;" onsubmit="handleAdminSubmit(event)">
        <div class="form-group">
          <label>Danh mục:</label>
          <select id="categoryAdmin">
            <option value="Game">Game</option>
            <option value="Tool">Tool</option>
            <option value="Phần mềm">Phần mềm</option>
            <option value="Tài liệu">Tài liệu</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tiêu đề:</label>
          <input type="text" id="titleAdmin" required>
        </div>
        <div class="form-group">
          <label>Mô tả:</label>
          <textarea id="descriptionAdmin" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>Link tải:</label>
          <input type="url" id="urlAdmin" required>
        </div>
        <div class="form-group">
          <label>Ảnh:</label>
          <input type="file" id="imageFileAdmin" accept="image/*">
          <small>Ảnh sẽ convert base64</small>
        </div>
        <button type="submit">Thêm/Sửa</button>
        <button type="button" onclick="cancelFormAdmin()">Hủy</button>
      </form>

      <div id="resourcesGridAdmin" style="margin-top:2rem;">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <script>
    const supabaseUrl = "https://huhyetvefyhlhyldkvis.supabase.co"
    const supabaseKey = "sb_publishable_40AA8unUr1HLIcgBn4gkFg_dvmCshjR" 
    const supabase = supabase.createClient(supabaseUrl, supabaseKey)
    
    let resourcesAdmin = [];
    let currentEditIdAdmin = null;
    let isLoggedInAdmin = false;
    const defaultCategoriesAdmin = ['Tất cả', 'Game', 'Tool', 'Phần mềm', 'Tài liệu'];

    // Supabase functions (replace API)
    async function fetchResourcesAdmin() {
      try {
        const { data, error } = await supabase
          .from('resources')
          .select('*')
          .order('date', { ascending: false });
        if (error) throw error;
        resourcesAdmin = data || [];
        renderAdminResources();
      } catch (err) {
        alert('Supabase error: ' + err.message);
      }
    }

    function renderCategoriesAdmin() {
      const select = document.getElementById('categoryFilterAdmin');
      select.innerHTML = defaultCategoriesAdmin.map(cat => `<option value="${cat}">${cat}</option>`).join('');
    }

    function renderAdminResources(filter = {}) {
      let filtered = resourcesAdmin;
      if (filter.category && filter.category !== 'Tất cả') filtered = filtered.filter(r => r.category === filter.category);
      if (filter.search) {
        const term = filter.search.toLowerCase();
        filtered = filtered.filter(r => r.title.toLowerCase().includes(term) || r.description.toLowerCase().includes(term));
      }
      const grid = document.getElementById('resourcesGridAdmin');
      grid.innerHTML = filtered.map(r => `
        <div class="resource-card">
          ${r.image ? `<img src="${r.image}" alt="${r.title}" class="resource-image">` : '<div class="resource-image" style="background:#eee;display:flex;align-items:center;justify-content:center;">No image</div>'}
          <div class="resource-content">
            <span class="resource-category">${r.category}</span>
            <h3>${r.title}</h3>
            <p>${r.description}</p>
            <p><a href="${r.url}" target="_blank">${r.url}</a></p>
            <p>Tải: ${r.downloads || 0} lần</p>
            <div>
              <button class="editBtn" onclick="editAdminResource('${r.id}')">Sửa</button>
              <button class="deleteBtn" onclick="deleteAdminResource('${r.id}')">Xóa</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function performAdminSearch() {
      const search = document.getElementById('searchInputAdmin').value;
      const category = document.getElementById('categoryFilterAdmin').value;
      renderAdminResources({ search, category });
    }

    function showLogin() {
      document.getElementById('loginFormAdmin').style.display = 'block';
    }

    async function loginAdmin() {
      const pass = document.getElementById('passwordAdmin').value;
      if (pass === 'hoquocdz01') {
        isLoggedInAdmin = true;
        document.getElementById('loginFormAdmin').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        document.getElementById('loginBtnAdmin').style.display = 'none';
        document.getElementById('logoutBtnAdmin').style.display = 'inline-block';
        await fetchResourcesAdmin();
        renderCategoriesAdmin();
      } else {
        alert('Sai mật khẩu!');
      }
    }

    function logoutAdmin() {
      isLoggedInAdmin = false;
      document.getElementById('adminContent').style.display = 'none';
      document.getElementById('resourceFormAdmin').style.display = 'none';
      document.getElementById('loginBtnAdmin').style.display = 'inline-block';
      document.getElementById('logoutBtnAdmin').style.display = 'none';
    }

    function showAddFormAdmin() {
      currentEditIdAdmin = null;
      document.getElementById('resourceFormAdmin').reset();
      document.getElementById('resourceFormAdmin').style.display = 'block';
    }

    function cancelFormAdmin() {
      document.getElementById('resourceFormAdmin').style.display = 'none';
    }

    function editAdminResource(id) {
      currentEditIdAdmin = id;
      const resource = resourcesAdmin.find(r => r.id === id);
      if (resource) {
        document.getElementById('categoryAdmin').value = resource.category;
        document.getElementById('titleAdmin').value = resource.title;
        document.getElementById('descriptionAdmin').value = resource.description;
        document.getElementById('urlAdmin').value = resource.url;
        document.getElementById('resourceFormAdmin').style.display = 'block';
      }
    }

    async function deleteAdminResource(id) {
      if (confirm('Xóa?')) {
        const { error } = await supabase.from('resources').delete().eq('id', id);
        if (!error) await fetchResourcesAdmin();
      }
    }

    async function handleAdminSubmit(e) {
      e.preventDefault();
      const formData = {
        category: document.getElementById('categoryAdmin').value,
        title: document.getElementById('titleAdmin').value,
        description: document.getElementById('descriptionAdmin').value,
        url: document.getElementById('urlAdmin').value,
        downloads: 0
      };
      const imageFile = document.getElementById('imageFileAdmin').files[0];
      if (imageFile) {
        const reader = new FileReader();
        reader.onload = async () => {
          formData.image = reader.result;
          await submitAdmin(formData);
        };
        reader.readAsDataURL(imageFile);
        return;
      }
      await submitAdmin(formData);
    }

    async function submitAdmin(formData) {
      try {
        let result;
        if (currentEditIdAdmin) {
          const { data, error } = await supabase
            .from('resources')
            .update(formData)
            .eq('id', currentEditIdAdmin);
          result = data;
        } else {
          const { data, error } = await supabase
            .from('resources')
            .insert([formData]);
          result = data[0];
        }
        if (result) {
          cancelFormAdmin();
          await fetchResourcesAdmin();
        }
      } catch (err) {
        alert('Lỗi: ' + err.message);
      }
    }

    // Load on start
    window.onload = () => {
      renderCategoriesAdmin();
    };
  </script>
</body>
</html>
