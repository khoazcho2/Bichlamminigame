<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔧 Admin - Quản lý Link</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <header>
      <img src="img/ChatGPT Image 18_33_23 9 thg 4, 2026.png" alt="Logo" class="logo">
      <h1>🔧 Admin Panel</h1>
    </header>

    <!-- Login Form -->
    <div id="loginForm" class="admin-form">
      <h2>🔐 Đăng nhập Admin</h2>
      <input type="password" id="passwordAdmin" placeholder="Nhập: hoquocdz01" maxlength="20">
      <button onclick="loginAdmin()">🚀 Đăng nhập</button>
      <p style="font-size: 0.9rem; color: #666; margin-top: 1rem;">Mật khẩu: <strong>hoquocdz01</strong> (đơn giản, thay đổi nếu cần)</p>
    </div>

    <!-- Admin Content -->
    <div id="adminContent" style="display: none;">
      <div class="admin-header">
        <h2>✅ Đã đăng nhập</h2>
        <button onclick="logout()" class="logout-btn">🚪 Đăng xuất</button>
      </div>
      
      <button onclick="showForm()" class="add-btn">➕ Thêm Link Mới</button>
      
      <!-- Add Form -->
      <form id="addForm" class="admin-form" style="display: none;">
        <div class="form-group">
          <label>Tiêu đề:</label>
          <input type="text" id="title" required maxlength="200">
        </div>
        <div class="form-group">
          <label>URL:</label>
          <input type="url" id="url" required>
        </div>
        <div class="form-group">
          <label>Danh mục:</label>
          <select id="category" required>
            <option value="">Chọn...</option>
            <option value="Game">Game</option>
            <option value="Tool">Tool</option>
            <option value="Phần mềm">Phần mềm</option>
            <option value="Tài liệu">Tài liệu</option>
            <option value="Khác">Khác</option>
          </select>
        </div>
        <button type="submit" class="save-btn">💾 Lưu Link</button>
      </form>
      
      <!-- Admin List -->
      <div id="resourcesList" class="admin-list">
        <!-- Loaded by JS -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    // Admin-specific functions
    function loginAdmin() {
      const password = document.getElementById('passwordAdmin').value;
      if (password === 'hoquocdz01') {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        loadAdminResources(); // From script.js
      } else {
        alert('❌ Sai mật khẩu!');
        document.getElementById('passwordAdmin').value = '';
      }
    }

    function logout() {
      document.getElementById('adminContent').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('passwordAdmin').value = '';
    }

    function showForm() {
      document.getElementById('addForm').style.display = 'block';
      document.getElementById('addForm').scrollIntoView({ behavior: 'smooth' });
    }

    // Add link handler
    document.getElementById('addForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const newLink = {
        title: document.getElementById('title').value.trim(),
        url: document.getElementById('url').value.trim(),
        category: document.getElementById('category').value,
        created_at: new Date().toISOString()
      };

      try {
        const { error } = await supabase.from('link').insert([newLink]);
        if (error) throw error;
        
        // Reset & hide form
        document.getElementById('addForm').reset();
        document.getElementById('addForm').style.display = 'none';
        
        // Reload list
        await loadAdminResources();
        alert('✅ Đã thêm link mới!');
      } catch (error) {
        alert('❌ Lỗi thêm: ' + error.message + '\nKiểm tra Supabase RLS/columns.');
      }
    });
  </script>
</body>
</html>
