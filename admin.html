<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔧 Admin - Quản Lý Link</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="admin-header">
      <img src="img/ChatGPT Image 18_33_23 9 thg 4, 2026.png" alt="Logo" class="logo">
      <h1>🔧 Admin Panel</h1>
      <button class="logout-btn" onclick="logout()">Thoát</button>
    </div>

    <!-- Login -->
    <div id="loginForm" class="admin-form">
      <h2>🔐 Đăng Nhập Admin</h2>
      <div class="form-group">
        <label>Mật khẩu:</label>
        <input type="password" id="password" placeholder="Nhập hoquocdz01">
      </div>
      <button class="add-btn" onclick="checkPassword()">Đăng Nhập</button>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" class="admin-form" style="display: none;">
      <h2>➕ Thêm Link Mới</h2>
      <div class="form-group">
        <label>Tiêu đề:</label>
        <input type="text" id="title" placeholder="VD: Google Drive Link">
      </div>
      <div class="form-group">
        <label>URL:</label>
        <input type="url" id="url" placeholder="https://drive.google.com/...">
      </div>
      <div class="form-group">
        <label>Danh mục:</label>
        <select id="category">
          <option value="Game">Game</option>
          <option value="Tool">Tool</option>
          <option value="Phần mềm">Phần mềm</option>
          <option value="Tài liệu">Tài liệu</option>
        </select>
      </div>
      <button class="add-btn" onclick="addLink()">➕ Thêm Link</button>
      
      <h2>📋 Danh Sách Link</h2>
      <div id="resourcesList" class="admin-list"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
  <script>
    function checkPassword() {
      const pw = document.getElementById('password').value;
      if (window.adminLogin && window.adminLogin(pw)) {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadAdminResources();
      } else {
        alert('❌ Sai mật khẩu!');
      }
    }

    function logout() {
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('adminPanel').style.display = 'none';
      document.getElementById('password').value = '';
    }

    // Auto-init after pw (script.js handles rest)
    window.addEventListener('load', () => {
      // Pw check in button
    });
  </script>
</body>
</html>
