<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔧 Admin</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <header>
      <img src="img/ChatGPT Image 18_33_23 9 thg 4, 2026.png" alt="Logo" class="logo">
      <h1>🔧 Admin</h1>
    </header>

    <div id="loginForm" class="admin-form">
      <h2>🔐 Login</h2>
      <input type="password" id="passwordAdmin" placeholder="Admin password">
      <button onclick="loginAdmin()">Login</button>
    </div>

    <div id="adminContent" style="display: none;">
      <div class="admin-header">
        <h2>✅ Logged in</h2>
        <button onclick="logout()" class="logout-btn">Logout</button>
      </div>
      <button onclick="showForm()" class="add-btn">➕ Add Link</button>
      
      <form id="addForm" class="admin-form" style="display: none;">
        <div class="form-group">
          <label>Title:</label>
          <input type="text" id="title" required>
        </div>
        <div class="form-group">
          <label>URL:</label>
          <input type="url" id="url" required>
        </div>
        <div class="form-group">
          <label>Category:</label>
          <select id="category" required>
            <option value="">Select...</option>
            <option value="Game">Game</option>
            <option value="Tool">Tool</option>
            <option value="Phần mềm">Software</option>
            <option value="Tài liệu">Docs</option>
            <option value="Khác">Other</option>
          </select>
        </div>
        <button type="submit" class="save-btn">Save</button>
      </form>
      
      <div id="resourcesList" class="admin-list"></div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    // Secure pw hash check (not readable)
    const ADMIN_PW_HASH = btoa('hoquocdz01');
    
    function loginAdmin() {
      const input = document.getElementById('passwordAdmin').value;
      if (btoa(input) === ADMIN_PW_HASH) {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        loadAdminResources();
      } else {
        alert('Wrong password!');
        document.getElementById('passwordAdmin').value = '';
      }
    }

    function logout() {
      document.getElementById('adminContent').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('passwordAdmin').value = '';
    }

    function showForm() {
      document.getElementById('addForm').style.display = 'block';
      document.getElementById('addForm').scrollIntoView();
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newLink = {
        title: document.getElementById('title').value.trim(),
        url: document.getElementById('url').value.trim(),
        category: document.getElementById('category').value,
        created_at: new Date().toISOString()
      };

      try {
        const { error } = await window.supabase.from('link').insert([newLink]);
        if (error) throw error;
        
        document.getElementById('addForm').reset();
        document.getElementById('addForm').style.display = 'none';
        await loadAdminResources();
        alert('✅ Added!');
      } catch (error) {
        alert('❌ Error: ' + error.message);
      }
    });
  </script>
</body>
</html>
